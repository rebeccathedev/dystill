[dystill]

# delimiter
# This defines a delimiter that can be used in email addresses, such as 
# me@rebeccapeck.org. dystill will parse this out to me@rebeccapeck.org and 
# deliver to the appropriate mailbox.
delimiter=-

[database]
host=localhost
user=postfix
password=password
database=postfix

users_table=users
user_id_field=id
email_field=email
homedir_field=homedir
maildir_field=maildir